[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoneme-embeddings"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
web = ["streamlit>=1.40", "scikit-learn", "vl-convert-python"]
hubert-soft = ["torch", "torchaudio"]
contentvec = ["torch", "torchaudio", "fairseq"]
whisper-ppg = ["torch", "torchaudio", "librosa"]
syllablelm = ["torch", "torchaudio", "omegaconf", "timm"]

[project.scripts]
extract-phoneme-embeddings = "phoneme_embeddings.extract:main"

[tool.setuptools.packages.find]
where = ["src"]
